# Print (gggpx): the P10 PrintNumbers command echoes resolved values back, so
# these exercise the parser + number formatting end to end.

- name: print_single
  description: "A bare decimal value echoes back unchanged."
  needs: [ gggpx ]
  tags: [ decimals ]
  program: "P10 V42"
  values: [ 42 ]

- name: print_request_id
  description: "A trailing O<id> arg tags the command; the id echoes on the return (here O7). With no O arg the id defaults to 1, rendering the familiar OK."
  needs: [ gggpx ]
  tags: [ decimals ]
  exact: true
  program: "P10 V42 O7"
  values: [ 42 ]

- name: print_list
  description: "A comma-separated value list echoes each value in order."
  needs: [ gggpx ]
  tags: [ decimals, lists ]
  program: "P10 V1,2,3"
  values: [ 1, 2, 3 ]

- name: print_zero
  description: "Zero is a value like any other."
  needs: [ gggpx ]
  tags: [ decimals ]
  program: "P10 V0"
  values: [ 0 ]

- name: print_negatives
  description: "Negative decimals are preserved."
  needs: [ gggpx ]
  tags: [ decimals, signs ]
  program: "P10 V-5,-10,15"
  values: [ -5, -10, 15 ]

- name: print_two_args
  # `exact`: the argument boundary is the thing under test — values alone can't
  # distinguish two args from one merged list.
  description: "Two value arguments stay distinct in the output."
  needs: [ gggpx ]
  tags: [ lists ]
  program: "P10 V1,2,3 V4,5,6"
  values: [ 1, 2, 3, 4, 5, 6 ]
  exact: true

- name: print_bytes
  description: "Byte-range decimals echo unchanged."
  needs: [ gggpx ]
  tags: [ decimals ]
  program: "P10 V255,128,64"
  values: [ 255, 128, 64 ]

- name: print_decimal
  description: "A negative fractional value is preserved."
  needs: [ gggpx ]
  tags: [ decimals ]
  program: "P10 V-1.5"
  values: [ -1.5 ]

- name: print_decimal_zero
  description: "A leading-zero fraction parses as a number, not a hex/zero prefix."
  needs: [ gggpx ]
  tags: [ decimals ]
  program: "P10 V0.5"
  values: [ 0.5 ]

- name: number_trailing_exponent
  # A number is parsed up to its longest valid prefix, so an exponent marker with
  # no digits after it ends the number rather than voiding it.
  description: "A dangling exponent marker ends the number instead of discarding it."
  needs: [ gggpx ]
  tags: [ decimals ]
  program: "P10 V5e"
  values: [ 5 ]

- name: number_trailing_letter
  # Same rule for a trailing letter that is part of float syntax elsewhere.
  description: "A trailing letter ends the number rather than discarding it."
  needs: [ gggpx ]
  tags: [ decimals ]
  program: "P10 V5X"
  values: [ 5 ]

- name: number_ends_at_letter
  # A character the number grammar cannot absorb ends the number, and is then
  # parsed in its own right -- here X starts a new argument rather than being
  # swallowed into the value.
  description: "A letter ends the number and begins a new argument."
  needs: [ gggpx ]
  tags: [ decimals ]
  exact: true
  program: "P10 V5X10"
  values: [ 5 ]

- name: number_ends_at_sign
  # A sign is not part of the number unless it follows an exponent marker, so it
  # begins another value under the same code -- an implicit list.
  description: "A sign begins another value under the same code."
  needs: [ gggpx ]
  tags: [ decimals, lists ]
  program: "P10 V5-3"
  values: [ 5, -3 ]

- name: number_hex_prefix_not_absorbed
  # "0x" is only a hex prefix at the start of a value; mid-number the x ends the
  # number, so -0x10 is the value -0 followed by the argument X10 (and negative
  # zero renders as 0).
  description: "A mid-number hex prefix ends the number rather than forming a hex float."
  needs: [ gggpx ]
  tags: [ decimals, hex ]
  exact: true
  program: "P10 V-0x10"
  values: [ 0 ]
