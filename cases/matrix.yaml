# Matrix commands (ggggx): G20 writes values into a register at an offset, G10
# reads a range back as a replayable G20 write. These run against the preloaded
# register "r" = [10,20,30] (index 0). The replay byte format (G20 R‹idx› P‹off›
# V‹data›) is itself part of the contract, so the read cases opt into `exact`.

- name: matrix_read
  description: "G10 reads a buffer back as a replayable G20 write."
  needs: [ ggggx ]
  tags: [ matrix ]
  program: "G10 R0 P0 S3"
  values: [ 10, 20, 30 ]
  exact: true

- name: matrix_read_offset
  description: "G10 reads a sub-range starting at an offset (P)."
  needs: [ ggggx ]
  tags: [ matrix ]
  program: "G10 R0 P1 S2"
  values: [ 20, 30 ]
  exact: true

- name: matrix_read_by_name
  description: "A register is addressable by name via L; the read replays by index."
  needs: [ ggggx ]
  tags: [ matrix ]
  program: 'G10 R"r" P0 S3'
  values: [ 10, 20, 30 ]
  exact: true

- name: matrix_read_by_ref
  description: "R is the universal selector: a string R resolves by name."
  needs: [ ggggx ]
  tags: [ matrix ]
  program: 'G10 R"r" P0 S3'
  values: [ 10, 20, 30 ]
  exact: true

- name: matrix_write_read
  description: "G20 writes values into the register; G10 reads them back."
  needs: [ ggggx ]
  tags: [ matrix ]
  program: |
    G20 R0 P0 V7,8,9
    G10 R0 P0 S3
  values: [ 7, 8, 9 ]
  exact: true

# Q write operators (combine the incoming value with the current cell). Run
# against r = [10,20,30]. Binary ops use both operands; unary ops (e.g. neg)
# apply to the cell when the V operand is 0.
- name: op_add
  description: "Q\"add\" adds the value into each cell."
  needs: [ ggggx ]
  tags: [ matrix, operator ]
  program: |
    G20 R0 P0 Q"add" V5,5,5
    G10 R0 P0 S3
  values: [ 15, 25, 35 ]

- name: op_sub
  description: "Q\"sub\" subtracts the value from each cell."
  needs: [ ggggx ]
  tags: [ matrix, operator ]
  program: |
    G20 R0 P0 Q"sub" V1,2,3
    G10 R0 P0 S3
  values: [ 9, 18, 27 ]

- name: op_mult
  description: "Q\"mult\" multiplies each cell by the value."
  needs: [ ggggx ]
  tags: [ matrix, operator ]
  program: |
    G20 R0 P0 Q"mult" V2,2,2
    G10 R0 P0 S3
  values: [ 20, 40, 60 ]

- name: op_min
  description: "Q\"min\" keeps the smaller of cell and value."
  needs: [ ggggx ]
  tags: [ matrix, operator ]
  program: |
    G20 R0 P0 Q"min" V15,15,15
    G10 R0 P0 S3
  values: [ 10, 15, 15 ]

- name: op_neg
  description: "Q\"neg\" negates the cell (a unary op; applies when V is 0)."
  needs: [ ggggx ]
  tags: [ matrix, operator ]
  program: |
    G20 R0 P0 Q"neg" V0,0,0
    G10 R0 P0 S3
  values: [ -10, -20, -30 ]

- name: op_sqrt
  # Transcendental op: float (C++) vs double (TS) differ in the last digits but
  # agree within the global epsilon -- exactly what the value contract is for.
  description: "Q\"sqrt\" takes the square root of the cell (value-tolerance)."
  needs: [ ggggx ]
  tags: [ matrix, operator ]
  program: |
    G20 R0 P0 Q"sqrt" V0
    G10 R0 P0 S1
  values: [ 3.1622776601683795 ]
