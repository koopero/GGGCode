# References (gggpx): $name reads a register. A fixed register "r" = [10,20,30] is
# preloaded by the conformance harness so these have data to read.

- name: ref_bare
  description: "A bare $name reads the whole register in order."
  needs: [ gggpx ]
  tags: [ references ]
  program: "P10 V$r"
  values: [ 10, 20, 30 ]

- name: ref_two
  # `exact` pins the two-argument separation, which the decoded value stream
  # (a flat number list) can't capture on its own.
  description: "A reference can appear mid-line, then another follows."
  needs: [ gggpx ]
  tags: [ references ]
  program: "P10 V$r V$r"
  values: [ 10, 20, 30, 10, 20, 30 ]
  exact: true

- name: ref_unknown
  description: "An unknown register reference yields no values."
  needs: [ gggpx ]
  tags: [ references ]
  program: "P10 V$x"
  values: []

- name: ref_subscript
  description: "$name[i] reads a single indexed scalar."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[1]"
  values: [ 20 ]

- name: ref_sub_range
  description: "$name[a:b] reads an inclusive range of indices."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[0:2]"
  values: [ 10, 20, 30 ]

- name: ref_sub_list
  description: "$name[a,b] reads a comma list of indices."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[0,2]"
  values: [ 10, 30 ]

- name: ref_sub_open
  # Subscripts resolve register-less (dimension 1), so an open `a:` is an
  # inclusive single-point range -- it reads just index a, not "a to the end".
  description: "$name[a:] reads a single index (subscripts resolve register-less)."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[1:]"
  values: [ 20 ]

- name: ref_sub_multi
  # Multi-axis subscript: a|b expands coordinate-wise into flat indices
  # (register-less, stride 1 per axis), each reading one scalar.
  description: "$name[a:b|c:d] expands axes coordinate-wise into flat indices."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[0:1|0:1]"
  values: [ 10, 20, 20, 30 ]

- name: ref_sub_multi_lone
  # Each lone value is an exact single coordinate; the axes add coordinate-wise
  # (register-less, stride 1 each) to flat index 1+1 = 2, reading $r[2] = 30.
  description: "Lone-value multi-axis subscript indexes an exact coordinate."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[1|1]"
  values: [ 30 ]

# Offset references ($x@[...]): yield flat OFFSETS computed from coordinates
# against the register's dimensions/strides, not the values. Run against the 2x3
# fixture "m" (strides [1,2]).
- name: off_origin
  description: "$x@[0|0] is the flat offset of the origin coordinate."
  needs: [ gggpx ]
  tags: [ references, offset ]
  program: "P10 V$m@[0|0]"
  values: [ 0 ]

- name: off_coord
  description: "$x@[a|b] is the flat offset of an exact coordinate."
  needs: [ gggpx ]
  tags: [ references, offset ]
  program: "P10 V$m@[1|2]"
  values: [ 5 ]

- name: off_coord_list
  description: "A comma list of coordinates yields each one's flat offset."
  needs: [ gggpx ]
  tags: [ references, offset ]
  program: "P10 V$m@[1|0,0|1]"
  values: [ 1, 2 ]

- name: off_range
  description: "Explicit coordinate ranges sweep, yielding a block of offsets."
  needs: [ gggpx ]
  tags: [ references, offset ]
  program: "P10 V$m@[0:1|0:2]"
  values: [ 0, 1, 2, 3, 4, 5 ]

- name: off_bare
  description: "A bare number in an offset ref is the offset itself."
  needs: [ gggpx ]
  tags: [ references, offset ]
  program: "P10 V$m@[4]"
  values: [ 4 ]
