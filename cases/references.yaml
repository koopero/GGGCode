# References (gggpx): $name reads a register. A fixed register "r" = [10,20,30] is
# preloaded by the conformance harness so these have data to read.

- name: ref_bare
  description: "A bare $name reads the whole register in order."
  needs: [ gggpx ]
  tags: [ references ]
  program: "P10 V$r"
  values: [ 10, 20, 30 ]

- name: ref_two
  # `exact` pins the two-argument separation, which the decoded value stream
  # (a flat number list) can't capture on its own.
  description: "A reference can appear mid-line, then another follows."
  needs: [ gggpx ]
  tags: [ references ]
  program: "P10 V$r V$r"
  values: [ 10, 20, 30, 10, 20, 30 ]
  exact: true

- name: ref_unknown
  description: "An unknown register reference yields no values."
  needs: [ gggpx ]
  tags: [ references ]
  program: "P10 V$x"
  values: []

- name: ref_subscript
  description: "$name[i] reads a single indexed scalar."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[1]"
  values: [ 20 ]

- name: ref_sub_range
  description: "$name[a:b] reads an inclusive range of indices."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[0:2]"
  values: [ 10, 20, 30 ]

- name: ref_sub_list
  description: "$name[a,b] reads a comma list of indices."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[0,2]"
  values: [ 10, 30 ]

- name: ref_sub_open
  # Subscripts resolve register-less (dimension 1), so an open `a:` is an
  # inclusive single-point range -- it reads just index a, not "a to the end".
  description: "$name[a:] reads a single index (subscripts resolve register-less)."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[1:]"
  values: [ 20 ]

- name: ref_sub_multi
  # Multi-axis subscript: a|b expands coordinate-wise into flat indices
  # (register-less, stride 1 per axis), each reading one scalar.
  description: "$name[a:b|c:d] expands axes coordinate-wise into flat indices."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[0:1|0:1]"
  values: [ 10, 20, 20, 30 ]

- name: ref_sub_multi_lone
  # A lone value on an axis resolves to count 0 register-less, so a lone-value
  # multi-axis collapses to nothing (the same quirk as register-less V1|2|3).
  description: "Lone-value multi-axis subscript collapses to nothing."
  needs: [ gggpx ]
  tags: [ references, subscript ]
  program: "P10 V$r[1|1]"
  values: []
