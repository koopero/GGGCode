# Unicode (gggpx): a non-ASCII character decodes to its Unicode code point.

- name: unicode_snowman
  description: "A Unicode character decodes to its code point."
  needs: [ gggpx ]
  tags: [ unicode ]
  program: "P10 V☃"
  values: [ 9731 ]

- name: unicode_cjk
  description: "A CJK character decodes to its code point."
  needs: [ gggpx ]
  tags: [ unicode ]
  program: "P10 V你"
  values: [ 20320 ]

- name: unicode_greek
  description: "A Greek letter decodes to its code point."
  needs: [ gggpx ]
  tags: [ unicode ]
  program: "P10 Vα"
  values: [ 945 ]

- name: unicode_euro
  description: "The euro sign decodes to its code point."
  needs: [ gggpx ]
  tags: [ unicode ]
  program: "P10 V€"
  values: [ 8364 ]

- name: unicode_emoji
  description: "An astral-plane emoji decodes to its full code point."
  needs: [ gggpx ]
  tags: [ unicode ]
  # The Q16.16 fixed Number tops out below this code point.
  requiresFloat: true
  program: "P10 V😀"
  values: [ 128512 ]

- name: unicode_list
  description: "Unicode characters list like any other values."
  needs: [ gggpx ]
  tags: [ unicode, lists ]
  program: "P10 V☃,你"
  values: [ 9731, 20320 ]

- name: unicode_range
  # A code point is an ordinary numeric value, so it works as a range bound.
  description: "A Unicode character can be the start of a range."
  needs: [ gggpx ]
  tags: [ unicode, ranges ]
  program: "P10 V☃:9735"
  values: [ 9731, 9732, 9733, 9734, 9735 ]

- name: unicode_range_multi
  # Multi-axis over code points adds coordinate-wise, like any other values.
  description: "Unicode code points combine on multiple axes."
  needs: [ gggpx ]
  tags: [ unicode, multiaxis ]
  program: "P10 V☃|你"
  values: [ 30051 ]

- name: unicode_adjacent
  # Two single-character values with no separator are two values, not one: the
  # second starts a new value rather than joining the first's axis.
  description: "Adjacent Unicode characters are separate values."
  needs: [ gggpx ]
  tags: [ unicode, lists ]
  program: "P10 V☃你"
  values: [ 9731, 20320 ]

- name: unicode_negated
  # A sign negates a code point like any other numeric value.
  description: "A sign before a Unicode character negates its code point."
  needs: [ gggpx ]
  tags: [ unicode ]
  program: "P10 V-☃"
  values: [ -9731 ]
