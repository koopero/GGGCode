# Ranges & multi-axis (gggpx): a:b sweeps, counts, steps, and |-joined axes
# expand to concrete value lists before printing.

- name: range_incl
  description: "a:b expands to an inclusive integer sweep."
  needs: [ gggpx ]
  tags: [ ranges ]
  program: "P10 V1:5"
  values: [ 1, 2, 3, 4, 5 ]

- name: range_excl
  description: "a>b expands to an exclusive sweep (stops before b)."
  needs: [ gggpx ]
  tags: [ ranges ]
  program: "P10 V1>5"
  values: [ 1, 2, 3, 4 ]

- name: range_count
  description: "a:b/n divides the inclusive range into n points."
  needs: [ gggpx ]
  tags: [ ranges ]
  program: "P10 V0:10/5"
  values: [ 0, 2.5, 5, 7.5, 10 ]

- name: range_step
  description: "a:b:s walks the inclusive range in steps of s."
  needs: [ gggpx ]
  tags: [ ranges ]
  program: "P10 V0:10:2"
  values: [ 0, 2, 4, 6, 8, 10 ]

- name: range_multiplier
  # The fourth axis slot is a multiplier: a:b:s:m scales every swept value by m.
  description: "a:b:s:m scales each value of the stepped range by the multiplier m."
  needs: [ gggpx ]
  tags: [ ranges ]
  program: "P10 V10:30:4:3"
  values: [ 30, 42, 54, 66, 78, 90 ]

- name: lone_multiplier
  # "*" sets the multiplier directly with no range, so a lone value is the single
  # point start*m -- here 2*10. (Each axis component is routed by its symbol, not
  # by position, so the range/step slots may be skipped.)
  description: "a*m is the single point start*m (multiplier with no range)."
  needs: [ gggpx ]
  tags: [ ranges ]
  program: "P10 V2*10"
  values: [ 20 ]

- name: range_in_list
  description: "A range may sit inside a comma list alongside plain values."
  needs: [ gggpx ]
  tags: [ ranges, lists ]
  program: "P10 V1:3,9"
  values: [ 1, 2, 3, 9 ]

- name: multiaxis
  # Each lone value is an exact single-point axis; the coordinate-wise product of
  # one-point axes is a single coordinate whose components add: 1+2+3 = 6.
  description: "Register-less multi-axis of lone values adds coordinate-wise."
  needs: [ gggpx ]
  tags: [ ranges, multiaxis ]
  program: "P10 V1|2|3"
  values: [ 6 ]

- name: multiaxis_range
  description: "Multi-axis ranges add coordinate-wise (nested register-less sweep)."
  needs: [ gggpx ]
  tags: [ ranges, multiaxis ]
  program: "P10 V1:2|10:20/2|100:200/2"
  values: [ 111, 112, 121, 122, 211, 212, 221, 222 ]

- name: multiaxis_multiplier
  # Multipliers place each lone-value axis at its own magnitude; the one-point
  # axes add coordinate-wise: 1 + 2*10 + 3*100 = 321.
  description: "Multi-axis multipliers add scaled single-point coordinates."
  needs: [ gggpx ]
  tags: [ ranges, multiaxis ]
  program: "P10 V1|2*10|3*100"
  values: [ 321 ]
