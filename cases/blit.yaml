# Blit (ggggx G40): transform-copy from a source register into a destination
# register by inverse mapping (iterate dest cells, map each to a source coord,
# sample, combine). These run against two preloaded fixtures: source "bs" = a 3x3
# matrix [1..9], and destination "bd" = a zeroed 3x3. Each case blits into "bd"
# then reads it back with G10, so the decoded V slot is the transform result.
# Axis 0 is the innermost (stride-1) axis, so transforms index axes in that order.
#
# Transform modes (the T arg; M reused per mode): box (default) = a source min,max
# rectangle in PIXEL coords stretched to fill the dest (omitted -> full source
# [0,dim], i.e. an identity copy); map = (srcAxis,min,max) triples, positional by
# DEST axis (dest axis k samples source axis srcAxis over [min,max]), so axes can
# swap -- transpose / rotation; affine = the general rank x (rank+1) matrix.
#
# Sampler (per-axis, continue-last lists; indices or names): I = filter (0 linear /
# 1 nearest -- how a point reads texels); F = minify fold (0 none / 1 mean / 2 min /
# 3 max / 4 add -- how to reduce the footprint when minifying; none = just sample
# the centre via the filter, so a minifying linear lerps/aliases and mean is
# explicit); E = edge (0 loop / 1 hold / 2 mirror / 3 zero). Defaults: I linear,
# F none, E loop. Filter and fold are independent (e.g. I0 F1 = lerp-sampled mean).

- name: blit_box_default
  description: "With no mode/coeffs the default box is the full source [0,dim] per axis -- an identity copy."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd"
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_box_full
  description: "An explicit full-source box M0,3,0,3 (min,max per axis, in source pixels) copies the source unchanged."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,3,0,3
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_box_subregion
  description: "A box selects a source sub-rectangle (x columns 1..3) and stretches it to fill the dest; nearest filter (I1)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M1,3,0,3 I1
    G10 R"bd"
  values: [ 2, 2, 3, 5, 5, 6, 8, 8, 9 ]

- name: blit_box_flip_x
  description: "A box flips an axis when its range runs backwards: M2.5,-0.5 on axis 0 (= [dim-0.5, -0.5], reversed + half-texel inset to land on pixel centers) mirrors each row left<->right. nearest filter (I1)."
  needs: [ ggggx ]
  tags: [ blit, flip ]
  program: |
    G40 R"bs" W"bd" T"box" M2.5,-0.5,0,3 I1
    G10 R"bd"
  values: [ 3, 2, 1, 6, 5, 4, 9, 8, 7 ]

- name: blit_box_flip_y
  description: "Reversing the axis-1 range (M...,2.5,-0.5) flips the matrix top<->bottom, leaving axis 0 as-is. nearest filter (I1)."
  needs: [ ggggx ]
  tags: [ blit, flip ]
  program: |
    G40 R"bs" W"bd" T"box" M0,3,2.5,-0.5 I1
    G10 R"bd"
  values: [ 7, 8, 9, 4, 5, 6, 1, 2, 3 ]

- name: blit_box_flip_180
  description: "Reversing both axes flips the matrix in both directions -- a 180-degree turn (every element reversed). nearest filter (I1)."
  needs: [ ggggx ]
  tags: [ blit, flip ]
  program: |
    G40 R"bs" W"bd" T"box" M2.5,-0.5,2.5,-0.5 I1
    G10 R"bd"
  values: [ 9, 8, 7, 6, 5, 4, 3, 2, 1 ]

- name: blit_map_axes
  description: "map's triples are (srcAxis,min,max) positional by dest axis: M0,0,3,1,1,3 = dest0<-src0 full, dest1<-src1 rows 1..3 -- i.e. it generalizes box (same as box M0,3,1,3). nearest filter (I1)."
  needs: [ ggggx ]
  tags: [ blit, map ]
  program: |
    G40 R"bs" W"bd" T"map" M0,0,3,1,1,3 I1
    G10 R"bd"
  values: [ 4, 5, 6, 4, 5, 6, 7, 8, 9 ]

- name: blit_map_default
  description: "map with no triples leaves every dest axis identity (dest k <- src k, full source) -- an identity copy."
  needs: [ ggggx ]
  tags: [ blit, map ]
  program: |
    G40 R"bs" W"bd" T"map"
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_map_transpose
  description: "Pointing each dest axis at the OTHER source axis (M1,0,3,0,0,3 = dest0<-src1, dest1<-src0) transposes the matrix (reflect across the main diagonal). nearest filter (I1)."
  needs: [ ggggx ]
  tags: [ blit, map, rotate ]
  program: |
    G40 R"bs" W"bd" T"map" M1,0,3,0,0,3 I1
    G10 R"bd"
  values: [ 1, 4, 7, 2, 5, 8, 3, 6, 9 ]

- name: blit_map_rotate_cw
  description: "A quarter turn clockwise = swap axes + reverse the swapped-in axis: M1,2.5,-0.5,0,0,3 (dest0<-src1 reversed, dest1<-src0). nearest filter (I1)."
  needs: [ ggggx ]
  tags: [ blit, map, rotate ]
  program: |
    G40 R"bs" W"bd" T"map" M1,2.5,-0.5,0,0,3 I1
    G10 R"bd"
  values: [ 7, 4, 1, 8, 5, 2, 9, 6, 3 ]

- name: blit_map_rotate_ccw
  description: "A quarter turn counter-clockwise = the other swap + reverse: M1,0,3,0,2.5,-0.5 (dest0<-src1, dest1<-src0 reversed). nearest filter (I1)."
  needs: [ ggggx ]
  tags: [ blit, map, rotate ]
  program: |
    G40 R"bs" W"bd" T"map" M1,0,3,0,2.5,-0.5 I1
    G10 R"bd"
  values: [ 3, 6, 9, 2, 5, 8, 1, 4, 7 ]

- name: blit_map_by_index
  description: "Mode by index T2 == map; a single triple (0,1,3) sets dest0<-src0 over [1,3] and leaves dest1 identity (== box [1,3] on axis 0). nearest filter (I1)."
  needs: [ ggggx ]
  tags: [ blit, map ]
  program: |
    G40 R"bs" W"bd" T2 M0,1,3 I1
    G10 R"bd"
  values: [ 2, 2, 3, 5, 5, 6, 8, 8, 9 ]

- name: blit_affine_identity
  description: "Affine mode with the identity matrix (linear part + zero translation) copies the source."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"affine" M1,0,0,0,1,0
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_mode_by_index
  description: "The transform mode accepts an index: T1 == affine."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T1 M1,0,0,0,1,0
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_magnify_nearest
  description: "A half-extent box [0,1.5] per axis magnifies the top-left 2x2 of the source; nearest filter (I1)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,1.5,0,1.5 I1
    G10 R"bd"
  values: [ 1, 1, 2, 1, 1, 2, 4, 4, 5 ]

- name: blit_magnify_linear
  description: "Same half-extent box with the default linear filter interpolates between source texels (fractional result)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,1.5,0,1.5
    G10 R"bd"
  values: [ 1, 1.5, 2, 2.5, 2.75, 3, 4, 4.5, 5 ]

- name: blit_filter_per_axis
  description: "I is per-axis: I0,1 = linear on X (smooth, fractional), nearest on Y (blocky) -- a magnify interpolates columns but steps rows."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,1.5,0,1.5 I0,1
    G10 R"bd"
  values: [ 1, 1.5, 2, 1, 1.5, 2, 4, 4.5, 5 ]

- name: blit_filter_by_name
  description: "Per-axis options also take names: I\"linear\",\"nearest\" == I0,1 (a comma-separated quoted-string list, which parses identically in both engines)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,1.5,0,1.5 I"linear","nearest"
    G10 R"bd"
  values: [ 1, 1.5, 2, 1, 1.5, 2, 4, 4.5, 5 ]

- name: blit_translate_hold
  description: "An axis-0 shifted box [1.2,4.2] with nearest filter + hold edge shifts and clamps at the edge (I1 E1)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M1.2,4.2,0,3 I1 E1
    G10 R"bd"
  values: [ 2, 3, 3, 5, 6, 6, 8, 9, 9 ]

- name: blit_operator_add
  description: "Q combines the sampled value into the destination cell: a default (full-source) blit with add onto a dest pre-filled with 10."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G20 R"bd" V10,10,10,10,10,10,10,10,10
    G40 R"bs" W"bd" Q"add"
    G10 R"bd"
  values: [ 11, 12, 13, 14, 15, 16, 17, 18, 19 ]

- name: blit_minify_lerp
  description: "Lerp WITH minify: a 1.5x oversized box [0,4.5] with the default linear filter and NO fold (F none) ignores the footprint and just lerps the centre -- interpolated but aliased. Shows linear coexists with minify; a fold is opt-in. Hold edge (E1)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,4.5,0,4.5 E1
    G10 R"bd"
  values: [ 1, 2.5, 3, 5.5, 7.25, 7.5, 7, 8.5, 9 ]

- name: blit_minify_mean
  description: "Explicit mean fold (F1): the 2x box [0,6] box-averages each cell's footprint (anti-aliases). mean is opt-in, not what linear does implicitly. Hold edge (E1)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,6,0,6 F1 E1
    G10 R"bd"
  values: [ 1, 2.75, 3, 5.5, 7.25, 7.5, 7, 8.75, 9 ]

- name: blit_minify_max
  description: "F3 = max fold: the 2x minify pools the footprint maximum instead of averaging. Hold edge (E1)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,6,0,6 F3 E1
    G10 R"bd"
  values: [ 1, 3, 3, 7, 9, 9, 7, 9, 9 ]

- name: blit_minify_pool
  description: "Separable per-axis fold: F3,1 = max-pool X (F3) but mean-pool Y (F1). Differs from a uniform fold, proving the fold is per-axis. Hold edge (E1)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,6,0,6 F3,1 E1
    G10 R"bd"
  values: [ 1, 3, 3, 5.5, 7.5, 7.5, 7, 9, 9 ]
