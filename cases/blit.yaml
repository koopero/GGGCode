# Blit (ggggx G40): transform-copy from a source register into a destination
# register by inverse mapping (iterate dest cells, map each to a source coord,
# sample, combine). These run against two preloaded fixtures: source "bs" = a 3x3
# matrix [1..9], and destination "bd" = a zeroed 3x3. Each case blits into "bd"
# then reads it back with G10, so the decoded V slot is the transform result.
# Axis 0 is the innermost (stride-1) axis, so transforms index axes in that order.

- name: blit_identity
  description: "G40 identity mode copies the source into the destination unchanged."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"identity"
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_affine_identity
  description: "Affine mode with the identity matrix (linear part + zero translation) copies the source."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"affine" M1,0,0,0,1,0
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_scale_identity
  description: "scale+translate mode with unit scale and zero translation copies the source."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"scale+translate" M1,1,0,0
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_mode_by_index
  description: "The transform mode accepts an index: T2 == scale+translate."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T2 M1,1,0,0
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_magnify_nearest
  description: "0.5 scale + nearest filter magnifies the top-left 2x2 of the source."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"scale+translate" M0.5,0.5,0,0 E"nearest"
    G10 R"bd"
  values: [ 1, 1, 2, 1, 1, 2, 4, 4, 5 ]

- name: blit_filter_by_index
  description: "Sampler options accept an index: E1 == nearest (slot 0 = filter)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T2 M0.5,0.5,0,0 E1
    G10 R"bd"
  values: [ 1, 1, 2, 1, 1, 2, 4, 4, 5 ]

- name: blit_magnify_linear
  description: "0.5 scale with the default linear filter interpolates between source texels (fractional result)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"scale+translate" M0.5,0.5,0,0
    G10 R"bd"
  values: [ 1, 1.5, 2, 2.5, 2.75, 3, 4, 4.5, 5 ]

- name: blit_translate_hold
  description: "A +0.4 normalized translate on axis 0 with nearest+hold shifts and clamps at the edge; E is positional [filter, edge] by index (E1,0)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"scale+translate" M1,1,0.4,0 E1,0
    G10 R"bd"
  values: [ 2, 3, 3, 5, 6, 6, 8, 9, 9 ]

- name: blit_operator_add
  description: "Q combines the sampled value into the destination cell: an identity blit with add onto a dest pre-filled with 10."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G20 R"bd" V10,10,10,10,10,10,10,10,10
    G40 R"bs" W"bd" T"identity" Q"add"
    G10 R"bd"
  values: [ 11, 12, 13, 14, 15, 16, 17, 18, 19 ]

- name: blit_minify_mid
  description: "Minification: a 2x scale makes each dest cell cover ~2 source texels; the transform-derived footprint is folded with mid (mean). E0,0,0,0 = linear, hold, normalized, reduce=mid."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"scale+translate" M2,2,0,0 E0,0,0,0
    G10 R"bd"
  values: [ 2.1875, 3.5625, 3.75, 6.6875, 8.0625, 8.25, 7.25, 8.75, 9 ]

- name: blit_minify_max
  description: "The reduce slot accepts max (E reduce index 2): 2x minify pooling the footprint maximum, nearest filter. E1,0,0,2 = nearest, hold, normalized, reduce=max."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"scale+translate" M2,2,0,0 E1,0,0,2
    G10 R"bd"
  values: [ 1, 3, 3, 7, 9, 9, 7, 9, 9 ]
