# Blit (ggggx G40): transform-copy from a source register into a destination
# register by inverse mapping (iterate dest cells, map each to a source coord,
# sample, combine). These run against two preloaded fixtures: source "bs" = a 3x3
# matrix [1..9], and destination "bd" = a zeroed 3x3. Each case blits into "bd"
# then reads it back with G10, so the decoded V slot is the transform result.
# Axis 0 is the innermost (stride-1) axis, so transforms index axes in that order.
#
# Transform modes (the T arg; M reused per mode): box (default) = a source min,max
# rectangle in PIXEL coords stretched to fill the dest (omitted -> full source
# [0,dim], i.e. an identity copy); map = box with (axis,min,max) triples so one
# axis can be remapped while the rest stay identity; affine = the general
# rank x (rank+1) matrix. Box subsumes the old scale+translate; a bare box is the
# identity copy, so there is no separate identity mode.

- name: blit_box_default
  description: "With no mode/coeffs the default box is the full source [0,dim] per axis -- an identity copy."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd"
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_box_full
  description: "An explicit full-source box M0,3,0,3 (min,max per axis, in source pixels) copies the source unchanged."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,3,0,3
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_box_subregion
  description: "A box selects a source sub-rectangle (x columns 1..3) and stretches it to fill the dest; nearest filter."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M1,3,0,3 E"nearest"
    G10 R"bd"
  values: [ 2, 2, 3, 5, 5, 6, 8, 8, 9 ]

- name: blit_map_axis
  description: "map mode takes (axis,min,max) triples: remap only axis 1 to source rows 1..3, leaving axis 0 identity. nearest filter."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"map" M1,1,3 E"nearest"
    G10 R"bd"
  values: [ 4, 5, 6, 4, 5, 6, 7, 8, 9 ]

- name: blit_map_default
  description: "map with no triples names no axes, so every axis stays full-source -- an identity copy."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"map"
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_map_by_index
  description: "Mode by index T2 == map; the (0,1,3) triple remaps axis 0 (== box [1,3] on axis 0). nearest filter."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T2 M0,1,3 E"nearest"
    G10 R"bd"
  values: [ 2, 2, 3, 5, 5, 6, 8, 8, 9 ]

- name: blit_affine_identity
  description: "Affine mode with the identity matrix (linear part + zero translation) copies the source."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"affine" M1,0,0,0,1,0
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_mode_by_index
  description: "The transform mode accepts an index: T1 == affine."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T1 M1,0,0,0,1,0
    G10 R"bd"
  values: [ 1, 2, 3, 4, 5, 6, 7, 8, 9 ]

- name: blit_magnify_nearest
  description: "A half-extent box [0,1.5] per axis magnifies the top-left 2x2 of the source; nearest filter."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,1.5,0,1.5 E"nearest"
    G10 R"bd"
  values: [ 1, 1, 2, 1, 1, 2, 4, 4, 5 ]

- name: blit_filter_by_index
  description: "Sampler options accept an index: E1 == nearest (slot 0 = filter). Box by index (T0)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T0 M0,1.5,0,1.5 E1
    G10 R"bd"
  values: [ 1, 1, 2, 1, 1, 2, 4, 4, 5 ]

- name: blit_magnify_linear
  description: "Same half-extent box with the default linear filter interpolates between source texels (fractional result)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,1.5,0,1.5
    G10 R"bd"
  values: [ 1, 1.5, 2, 2.5, 2.75, 3, 4, 4.5, 5 ]

- name: blit_translate_hold
  description: "An axis-0 shifted box [1.2,4.2] with nearest+hold shifts and clamps at the edge; E is positional [filter, edge] by index (E1,0)."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M1.2,4.2,0,3 E1,0
    G10 R"bd"
  values: [ 2, 3, 3, 5, 6, 6, 8, 9, 9 ]

- name: blit_operator_add
  description: "Q combines the sampled value into the destination cell: a default (full-source) blit with add onto a dest pre-filled with 10."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G20 R"bd" V10,10,10,10,10,10,10,10,10
    G40 R"bs" W"bd" Q"add"
    G10 R"bd"
  values: [ 11, 12, 13, 14, 15, 16, 17, 18, 19 ]

- name: blit_minify_mid
  description: "Minification: an oversized box [0,6] (2x the source extent) makes each dest cell cover ~2 source texels; the transform-derived footprint is folded with mid (mean). E0,0,0,0 = linear, hold, normalized, reduce=mid."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,6,0,6 E0,0,0,0
    G10 R"bd"
  values: [ 2.1875, 3.5625, 3.75, 6.6875, 8.0625, 8.25, 7.25, 8.75, 9 ]

- name: blit_minify_max
  description: "The reduce slot accepts max (E reduce index 2): 2x minify pooling the footprint maximum, nearest filter. E1,0,0,2 = nearest, hold, normalized, reduce=max."
  needs: [ ggggx ]
  tags: [ blit ]
  program: |
    G40 R"bs" W"bd" T"box" M0,6,0,6 E1,0,0,2
    G10 R"bd"
  values: [ 1, 3, 3, 7, 9, 9, 7, 9, 9 ]
